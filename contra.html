<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RADAR EUSKADI · Noticias</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e5e9ef;
  font-family:Arial, Helvetica, sans-serif;
  color:#111;
}

.contenedor{
  max-width:1280px;
  margin:auto;
  background:white;
  min-height:100vh;
}

/* CABECERA */

.cabecera{
  background:#002b5c;
  color:white;
  border-bottom:5px solid #0057b8;
}

.cabecera-interior{
  padding:24px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:2.6rem;
  font-weight:900;
  letter-spacing:1px;
}

.sublogo{
  color:#c7d5e5;
  font-size:0.85rem;
  margin-top:5px;
}

.fecha{
  color:#c7d5e5;
  font-size:0.82rem;
}

/* TITULO */

.bloque-titulo{
  padding:28px 40px 10px 40px;
}

.titulo-seccion{
  font-size:1.7rem;
  border-left:6px solid #0057b8;
  padding-left:14px;
}

/* GRID NOTICIAS */

.grid-noticias{
  padding:25px 40px 40px 40px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:24px;
}

.tarjeta{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
  transition:.25s;
}

.tarjeta:hover{
  transform:translateY(-4px);
}

.tarjeta img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.tarjeta-contenido{
  padding:18px;
}

.tarjeta h2{
  font-family:Georgia, serif;
  font-size:1.2rem;
  line-height:1.35;
  margin-bottom:10px;

  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.autor{
  font-size:.72rem;
  color:#777;
  margin-bottom:10px;
}

.tarjeta p{
  font-size:.95rem;
  line-height:1.6;
  color:#555;

  display:-webkit-box;
  -webkit-line-clamp:6;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.link-noticia{
  text-decoration:none;
  color:inherit;
}

/* FOOTER */

.footer{
  background:#002b5c;
  color:white;
  padding:24px 40px;
  font-size:.82rem;
  line-height:1.7;
}

/* TABLET */

@media(max-width:1100px){

.grid-noticias{
grid-template-columns:repeat(2,1fr);
}

}

/* MOVIL */

@media(max-width:700px){

.cabecera-interior{
padding:18px;
flex-direction:column;
align-items:flex-start;
gap:10px;
}

.logo{
font-size:2rem;
}

.bloque-titulo{
padding:20px 18px 10px;
}

.grid-noticias{
grid-template-columns:1fr;
padding:18px;
gap:18px;
}

.tarjeta img{
height:210px;
}

.footer{
padding:18px;
}

}

</style>

</head>

<body>

<div class="contenedor">

<header class="cabecera">

<div class="cabecera-interior">

<div>

<div class="logo">
RADAR EUSKADI
</div>

<div class="sublogo">
Seguridad · Policía · Actualidad sindical
</div>

</div>

<div class="fecha" id="fecha"></div>

</div>

</header>

<section class="bloque-titulo">

<h1 class="titulo-seccion">
Más noticias
</h1>

</section>

<section class="grid-noticias"
id="gridNoticias">
</section>

<footer class="footer">

RADAR EUSKADI · Información policial y sindical<br>
info@radareuskadi.com

</footer>

</div>

<script>

const hoy=new Date();

document.getElementById('fecha').innerText=
hoy.toLocaleDateString(
'eu-ES',
{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

fetch('noticias2.json')

.then(response=>response.json())

.then(data=>{

const grid=
document.getElementById(
'gridNoticias');

const noticias=[

{
titular:data.principal.titular,
texto:data.principal.texto,
imagen:'imagenes/8.jpg',
enlace:'noticia8.html'
},

...data.secundarias.map(
(n,i)=>({

titular:n.titular,

texto:n.texto,

imagen:
`imagenes/${i+9}.jpg`,

enlace:
`noticia${i+9}.html`

}))

];

noticias
.slice(0,8)
.forEach(noticia=>{

const tarjeta=
document.createElement(
'article');

tarjeta.className=
'tarjeta';

tarjeta.innerHTML=`

<img src="${noticia.imagen}" alt="">

<div class="tarjeta-contenido">

<a href="${noticia.enlace}"
class="link-noticia">

<h2>
${noticia.titular}
</h2>

</a>

<div class="autor">
R.E.
</div>

<p>
${noticia.texto}
</p>

</div>

`;

grid.appendChild(
tarjeta);

});

});

</script>

</body>
</html>
